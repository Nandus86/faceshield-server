name: reconhecimento-facial

services:
  app:
    build: .
    container_name: faceshield_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is "db"
      DATABASE_URL: postgresql+asyncpg://faceshield:faceshield_secret@db:5432/faceshield
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - insightface-models:/root/.insightface
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: faceshield_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: faceshield
      POSTGRES_USER: faceshield
      POSTGRES_PASSWORD: faceshield_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceshield -d faceshield"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  pgdata:
  insightface-models:
